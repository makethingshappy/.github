name: Sync to Shopify

on:
  push:
    paths:
      - 'profile/PUBLICATIONS.md'
      - 'CARRIER_COMPATIBILITY.md'
      - 'IOTEXTRA_NODERED_COMPATIBILITY.md'
      - 'IOTEXTRA_TASMOTA_COMPATIBILITY.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4

      - name: Sync to Shopify
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import re
          import urllib.request
          import urllib.error
          import json
          import os

          shop = '55b706-7c.myshopify.com'
          token = os.environ['SHOPIFY_TOKEN']

          def get_page(page_id):
              req = urllib.request.Request(
                  f'https://{shop}/admin/api/2024-01/pages/{page_id}.json',
                  method='GET'
              )
              req.add_header('X-Shopify-Access-Token', token)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())['page']['body_html']

          def update_page(page_id, html):
              payload = json.dumps({'page': {'body_html': html}}).encode('utf-8')
              req = urllib.request.Request(
                  f'https://{shop}/admin/api/2024-01/pages/{page_id}.json',
                  data=payload, method='PUT'
              )
              req.add_header('Content-Type', 'application/json')
              req.add_header('X-Shopify-Access-Token', token)
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  print(f"Updated: {result['page']['title']}")

          def inject_marker(html, marker, content):
              start = f'<!-- {marker}_START -->'
              end = f'<!-- {marker}_END -->'
              pattern = f'{re.escape(start)}.*?{re.escape(end)}'
              replacement = f'{start}\n{content}\n{end}'
              new_html, count = re.subn(pattern, replacement, html, flags=re.DOTALL)
              if count == 0:
                  print(f"WARNING: marker {marker} not found!")
              return new_html

          def convert_cell(cell):
              cell = re.sub(r'\[!\[([^\]]+)\]\([^)]*\)\]\(([^)]+)\)', r'<a href="\2">[\1]</a>', cell)
              cell = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2">\1</a>', cell)
              cell = re.sub(r'\*\*([^*]+)\*\*', r'<strong>\1</strong>', cell)
              return cell

          def md_to_html(md):
              lines = md.strip().split('\n')
              html_parts = []
              in_table = False
              first_row = True
              for line in lines:
                  s = line.strip()
                  if s.startswith('#'):
                      continue
                  if re.match(r'^\|[-| :]+\|$', s):
                      first_row = False
                      continue
                  if s.startswith('|'):
                      if not in_table:
                          html_parts.append('<table style="border-collapse:collapse;width:100%">')
                          in_table = True
                          first_row = True
                      tag = 'th' if first_row else 'td'
                      cells = [convert_cell(c.strip()) for c in s.strip('|').split('|')]
                      html_parts.append('<tr>' + ''.join(
                          f'<{tag} style="border:1px solid #ccc;padding:6px;text-align:left">{c}</{tag}>'
                          for c in cells) + '</tr>')
                      first_row = False
                      continue
                  if in_table:
                      html_parts.append('</table><p style="margin-top:12px"></p>')
                      in_table = False
                      first_row = True
                  if not s:
                      continue
                  s = re.sub(r'\*\*([^*]+)\*\*', r'<strong>\1</strong>', s)
                  s = re.sub(r'\[!\[([^\]]+)\]\([^)]*\)\]\(([^)]*)\)\s*', r'<a href="\2">[\1]</a> ', s)
                  s = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2">\1</a>', s)
                  if s.startswith('- '):
                      s = '<li>' + s[2:] + '</li>'
                  html_parts.append(s)
              if in_table:
                  html_parts.append('</table><p style="margin-top:12px"></p>')
              return '\n'.join(html_parts)

          def publications_to_html(md):
              html_parts = []
              ul_items = []
              def flush_ul():
                  if ul_items:
                      html_parts.append('<ul>\n' + '\n'.join(ul_items) + '\n</ul>')
                      ul_items.clear()
              for line in md.split('\n'):
                  if line.startswith('# '):
                      flush_ul()
                  elif line.startswith('### '):
                      flush_ul()
                      html_parts.append(f'<h3>{line[4:].strip()}</h3>')
                  elif line.startswith('- '):
                      match = re.match(r'- \[(.+?)\]\((.+?)\)', line)
                      if match:
                          ul_items.append(f'  <li><a href="{match.group(2)}">{match.group(1)}</a></li>')
                  elif line.strip() == '':
                      flush_ul()
              flush_ul()
              return '\n'.join(html_parts)

          with open('profile/PUBLICATIONS.md') as f:
              pub_html = publications_to_html(f.read())
          with open('CARRIER_COMPATIBILITY.md') as f:
              carrier_html = md_to_html(f.read())
          with open('IOTEXTRA_NODERED_COMPATIBILITY.md') as f:
              nodered_html = md_to_html(f.read())
          with open('IOTEXTRA_TASMOTA_COMPATIBILITY.md') as f:
              tasmota_html = md_to_html(f.read())

          update_page('160783663390', pub_html)

          pages = {
              '155994652958': [
                  ('CARRIER_COMPATIBILITY', carrier_html),
                  ('IOTEXTRA_NODERED_COMPATIBILITY', nodered_html),
              ],
              '160892322078': [
                  ('CARRIER_COMPATIBILITY', carrier_html),
                  ('IOTEXTRA_TASMOTA_COMPATIBILITY', tasmota_html),
              ],
              '155104608542': [
                  ('CARRIER_COMPATIBILITY', carrier_html),
                  ('IOTEXTRA_NODERED_COMPATIBILITY', nodered_html),
                  ('IOTEXTRA_TASMOTA_COMPATIBILITY', tasmota_html),
              ],
          }

          for page_id, markers in pages.items():
              html = get_page(page_id)
              for marker, content in markers:
                  html = inject_marker(html, marker, content)
              update_page(page_id, html)

          carrier_html += '<p></p>'
          nodered_html += '<p></p>'
          tasmota_html += '<p></p>'

          print("All done!")
          PYEOF
