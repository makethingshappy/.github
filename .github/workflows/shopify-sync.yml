name: Sync Publications to Shopify

on:
  push:
    paths:
      - 'profile/PUBLICATIONS.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4

      - name: Update Shopify page via REST API
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import re
          import urllib.request
          import urllib.error
          import json
          import os

          with open('profile/PUBLICATIONS.md', 'r') as f:
              content = f.read()

          html_parts = []
          ul_items = []

          def flush_ul():
              if ul_items:
                  html_parts.append('<ul>\n' + '\n'.join(ul_items) + '\n</ul>')
                  ul_items.clear()

          for line in content.split('\n'):
              if line.startswith('# '):
                  flush_ul()
              elif line.startswith('### '):
                  flush_ul()
                  html_parts.append(f'<h3>{line[4:].strip()}</h3>')
              elif line.startswith('- '):
                  match = re.match(r'- \[(.+?)\]\((.+?)\)', line)
                  if match:
                      ul_items.append(f'  <li><a href="{match.group(2)}">{match.group(1)}</a></li>')
              elif line.strip() == '':
                  flush_ul()

          flush_ul()
          html = '\n'.join(html_parts)
          print("HTML to write:")
          print(html[:200])

          shop = '55b706-7c.myshopify.com'
          token = os.environ['SHOPIFY_TOKEN']
          page_id = '160783663390'

          payload = json.dumps({
              'page': {
                  'body_html': html
              }
          }).encode('utf-8')

          req = urllib.request.Request(
              f'https://{shop}/admin/api/2024-01/pages/{page_id}.json',
              data=payload,
              method='PUT'
          )
          req.add_header('Content-Type', 'application/json')
          req.add_header('X-Shopify-Access-Token', token)

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  page = result.get('page', {})
                  print(f"Updated: {page.get('title')}")
                  print(f"Body preview: {page.get('body_html','')[:200]}")
          except urllib.error.HTTPError as e:
              print(f"HTTP Error {e.code}:", e.read().decode())
              raise
          PYEOF
