name: Sync Compatibility Tables

on:
  push:
    paths:
      - 'CARRIER_COMPATIBILITY.md'
      - 'IOTEXTRA_NODERED_COMPATIBILITY.md'
      - 'IOTEXTRA_TASMOTA_COMPATIBILITY.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MTH_SYNC_TOKEN }}

      - name: Checkout IoTflow repo
        uses: actions/checkout@v4
        with:
          repository: makethingshappy/IoTflow
          token: ${{ secrets.MTH_SYNC_TOKEN }}
          path: IoTflow

      - name: Create sync script
        run: |
          cat > /tmp/sync_tables.py << 'PYEOF'
          import re
          import sys
          import os

          carrier_file = sys.argv[1]
          nodered_file = sys.argv[2]
          tasmota_file = sys.argv[3]
          target_file = sys.argv[4]

          if not os.path.exists(target_file):
              print(f"Skipping {target_file} - not found")
              sys.exit(0)

          with open(carrier_file, 'r') as f:
              carrier = f.read()
          with open(nodered_file, 'r') as f:
              nodered = f.read()
          with open(tasmota_file, 'r') as f:
              tasmota = f.read()
          with open(target_file, 'r') as f:
              content = f.read()

          content = re.sub(
              r'<!-- CARRIER_COMPATIBILITY_START -->.*?<!-- CARRIER_COMPATIBILITY_END -->',
              '<!-- CARRIER_COMPATIBILITY_START -->\n' + carrier + '\n<!-- CARRIER_COMPATIBILITY_END -->',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'<!-- IOTEXTRA_NODERED_COMPATIBILITY_START -->.*?<!-- IOTEXTRA_NODERED_COMPATIBILITY_END -->',
              '<!-- IOTEXTRA_NODERED_COMPATIBILITY_START -->\n' + nodered + '\n<!-- IOTEXTRA_NODERED_COMPATIBILITY_END -->',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'<!-- IOTEXTRA_TASMOTA_COMPATIBILITY_START -->.*?<!-- IOTEXTRA_TASMOTA_COMPATIBILITY_END -->',
              '<!-- IOTEXTRA_TASMOTA_COMPATIBILITY_START -->\n' + tasmota + '\n<!-- IOTEXTRA_TASMOTA_COMPATIBILITY_END -->',
              content, flags=re.DOTALL
          )

          with open(target_file, 'w') as f:
              f.write(content)

          print(f"Updated {target_file}")
          PYEOF

      - name: Sync tables into IoTflow files
        run: |
          for FILE in \
            "IoTflow/README.md" \
            "IoTflow/Documentation/SETUP.md" \
            "IoTflow/IoTflow Forge/README.md" \
            "IoTflow/node-red-contrib-iotextra/README.md"; do
            python3 /tmp/sync_tables.py \
              CARRIER_COMPATIBILITY.md \
              IOTEXTRA_NODERED_COMPATIBILITY.md \
              IOTEXTRA_TASMOTA_COMPATIBILITY.md \
              "$FILE"
          done

      - name: Sync tables into .github profile README
        run: |
          python3 /tmp/sync_tables.py \
            CARRIER_COMPATIBILITY.md \
            IOTEXTRA_NODERED_COMPATIBILITY.md \
            IOTEXTRA_TASMOTA_COMPATIBILITY.md \
            "profile/README.md"

      - name: Commit changes to IoTflow
        run: |
          cd IoTflow
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-sync compatibility tables"
          git push

      - name: Commit changes to .github
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --staged --quiet || git commit -m "Auto-sync compatibility tables"
          git push
