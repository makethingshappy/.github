name: MTH Sync
on:
  push:
    paths:
      - 'CARRIER_COMPATIBILITY.md'
      - 'IOTEXTRA_NODERED_COMPATIBILITY.md'
      - 'IOTEXTRA_TASMOTA_COMPATIBILITY.md'
      - 'IOTEXTRA_SOFTWARE_COMPATIBILITY.md'
      - 'IOTEXTRA_ESPHOME_COMPATIBILITY.md'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MTH_SYNC_TOKEN }}
      - name: Checkout IoTflow repo
        uses: actions/checkout@v4
        with:
          repository: makethingshappy/IoTflow
          token: ${{ secrets.MTH_SYNC_TOKEN }}
          path: IoTflow
      - name: Checkout IoThome repo
        uses: actions/checkout@v4
        with:
          repository: makethingshappy/IoThome
          token: ${{ secrets.MTH_SYNC_TOKEN }}
          path: IoThome
      - name: Checkout MTH-for-ESPHome repo
        uses: actions/checkout@v4
        with:
          repository: makethingshappy/MTH-for-ESPHome
          token: ${{ secrets.MTH_SYNC_TOKEN }}
          path: MTH-for-ESPHome
      - name: Create sync script
        run: |
          cat > /tmp/sync_tables.py << 'PYEOF'
          import re
          import sys
          import os
          # usage: sync_tables.py <target_file>
          # Tables are read from the current directory (.github repo root).
          TABLES = {
              'CARRIER_COMPATIBILITY': 'CARRIER_COMPATIBILITY.md',
              'IOTEXTRA_SOFTWARE_COMPATIBILITY': 'IOTEXTRA_SOFTWARE_COMPATIBILITY.md',
              'IOTEXTRA_NODERED_COMPATIBILITY': 'IOTEXTRA_NODERED_COMPATIBILITY.md',
              'IOTEXTRA_TASMOTA_COMPATIBILITY': 'IOTEXTRA_TASMOTA_COMPATIBILITY.md',
              'IOTEXTRA_ESPHOME_COMPATIBILITY': 'IOTEXTRA_ESPHOME_COMPATIBILITY.md',
          }
          target_file = sys.argv[1]
          if not os.path.exists(target_file):
              print(f"Skipping {target_file} - not found")
              sys.exit(0)
          with open(target_file, 'r') as f:
              content = f.read()
          for marker, table_file in TABLES.items():
              start = f'<!-- {marker}_START -->'
              end = f'<!-- {marker}_END -->'
              if start not in content or end not in content:
                  continue
              with open(table_file, 'r') as f:
                  table = f.read()
              block = start + '\n' + table + '\n' + end
              content = re.sub(
                  re.escape(start) + '.*?' + re.escape(end),
                  lambda m: block,
                  content, flags=re.DOTALL
              )
              print(f"  {marker} -> {target_file}")
          with open(target_file, 'w') as f:
              f.write(content)
          print(f"Updated {target_file}")
          PYEOF
      - name: Sync tables into IoTflow files
        run: |
          for FILE in \
            "IoTflow/README.md" \
            "IoTflow/Documentation/SETUP.md" \
            "IoTflow/IoTflow Forge/README.md" \
            "IoTflow/node-red-contrib-iotextra/README.md"; do
            python3 /tmp/sync_tables.py "$FILE"
          done
      - name: Sync tables into IoThome files
        run: |
          for FILE in \
            "IoThome/README.md" \
            "IoThome/Documentation/Setup.md" \
            "IoThome/Tasmota_Templates/README.md"; do
            python3 /tmp/sync_tables.py "$FILE"
          done
      - name: Sync tables into MTH-for-ESPHome files
        run: |
          for FILE in \
            "MTH-for-ESPHome/README.md" \
            "MTH-for-ESPHome/Documentation/Setup.md"; do
            python3 /tmp/sync_tables.py "$FILE"
          done
      - name: Sync tables into .github profile README
        run: |
          python3 /tmp/sync_tables.py "profile/README.md"
      - name: Commit changes to IoTflow
        run: |
          cd IoTflow
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-sync compatibility tables"
          git push
      - name: Commit changes to MTH-for-ESPHome
        run: |
          cd MTH-for-ESPHome
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-sync compatibility tables"
          git push
      - name: Commit changes to IoThome
        run: |
          cd IoThome
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-sync compatibility tables"
          git push
      - name: Commit changes to .github
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --staged --quiet || git commit -m "Auto-sync compatibility tables"
          git push
